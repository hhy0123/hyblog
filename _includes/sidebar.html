<aside class="sidebar">
  <div class="widget widget-about">
    <h3>소개</h3>
    <p>{{ site.tagline }}</p>
    <a class="widget-link" href="{{ '/about/' | relative_url }}">더 알아보기 →</a>
  </div>

  {% if site.categories.size > 0 %}
  <div class="widget widget-categories">
    <h3>카테고리</h3>
    <ul>
      {% for cat in site.categories %}
        <li>
          <span class="dot dot-{{ forloop.index0 | modulo: 4 }}"></span>
          {{ cat[0] }}
          <span class="count">{{ cat[1].size }}</span>
        </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  {% if site.tags.size > 0 %}
  <div class="widget widget-tags">
    <h3>태그</h3>
    <div class="tag-cloud">
      {% for tag in site.tags %}
        <span class="badge badge-tag cat-{{ forloop.index0 | modulo: 4 }}">#{{ tag[0] }}</span>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</aside>
