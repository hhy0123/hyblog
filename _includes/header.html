<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>{{ site.title }}</a>
    <nav class="site-nav">
      {% for link in site.nav_links %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} class="active"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="라이트/다크 모드 전환">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>
</header>
