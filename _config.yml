# The Site Configuration
# 이 파일은 "테마 설정"입니다. 글 내용은 여기 안 쓰고 _posts 폴더에 씁니다.
# 이 사이트는 외부 테마 젬 없이, _layouts/_includes/assets를 직접 만든 커스텀 테마를 씁니다.

# 화면 언어(레이아웃 텍스트: "홈", "태그" 같은 UI 문구). 본문 내용의 언어와는 무관합니다.
lang: ko-KR

# 시간대. 글 작성 시간이 이 기준으로 표시됩니다.
timezone: Asia/Seoul

# ↓-------------------------- SEO / 기본 정보 --------------------------

title: hy의 학습노트 # 사이트 제목

tagline: 개발을 배우며 남기는 기록 # 제목 아래 부제

description: >- # 검색엔진, RSS에 쓰이는 사이트 설명
  개발을 배우면서 그날그날 정리한 것을 남기는 학습 블로그입니다.

# 반드시 채워야 합니다. 끝에 '/' 붙이지 마세요.
url: "https://hhy0123.github.io"

github:
  username: hhy0123

social:
  name: hy # 글 작성자로 표시될 이름
  links:
    - https://github.com/hhy0123 # 본인 GitHub 프로필

# ↑-------------------------- SEO / 기본 정보 끝 --------------------------

# 상단 내비게이션에 보여줄 탭. (표시 텍스트, 링크) 순서대로 나옵니다.
nav_links:
  - title: 홈
    url: /
  - title: About
    url: /about/

# 글마다 자동으로 만들어지는 목차(TOC). 가독성에 도움이 되니 켜둡니다.
toc: true

# 홈 화면 미리보기(excerpt)를 자를 위치. 각 글 머리말 바로 다음에 한 줄 요약 + 이 구분자를 넣어두면
# 소제목/본문이 아니라 그 요약 한 줄이 미리보기로 뽑힙니다.
excerpt_separator: "<!--more-->"

# 프로젝트 페이지(예: username.github.io/my-blog)로 운영할 때 저장소 이름과 똑같이 맞춰야 합니다.
baseurl: "/hyblog"

# ------------ 아래는 특별한 이유 없으면 그대로 두는 걸 추천 ------------------

plugins:
  - jekyll-paginate-v2

# 홈 화면 페이지네이션. 오래된 글(가장 먼저 쓴 글)부터 순서대로 넘어가도록 오름차순 정렬.
pagination:
  enabled: true
  per_page: 4
  permalink: '/page:num/'
  sort_field: 'date'
  sort_reverse: false

# home.html이 페이지 링크를 만들 때 이 값을 그대로 참조하므로 위 permalink와 맞춰서 유지.
paginate_path: "/page:num/"

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      toc: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
